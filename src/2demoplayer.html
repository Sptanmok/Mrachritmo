<!DOCTYPE html>
<html>
<head>
<link rel="preload" href="https://cdn.mioical.moe/font/Saira-Light.woff2" as="font" type="font/woff2" crossorigin="">
<link rel="preload" href="https://cdn.mioical.moe/font/LXGWWenKai-Light.woff2" as="font" type="font/woff2" crossorigin="">
<link rel="stylesheet" type="text/css" href="player2.css">
<meta charset="utf-8">
<title>demo</title>
</head>
<body>
    <a href="https://github.com/Sptanmok/Mrachritmo" class="github-corner" aria-label="View source on GitHub"><svg width="80" height="80" viewBox="0 0 250 250" style="fill:#151513; color:#fff; position: absolute; top: 0; border: 0; right: 0;" aria-hidden="true"><path d="M0,0 L115,115 L130,115 L142,142 L250,250 L250,0 Z"/><path d="M128.3,109.0 C113.8,99.7 119.0,89.6 119.0,89.6 C122.0,82.7 120.5,78.6 120.5,78.6 C119.2,72.0 123.4,76.3 123.4,76.3 C127.3,80.9 125.5,87.3 125.5,87.3 C122.9,97.6 130.6,101.9 134.4,103.2" fill="currentColor" style="transform-origin: 130px 106px;" class="octo-arm"/><path d="M115.0,115.0 C114.9,115.1 118.7,116.5 119.8,115.4 L133.7,101.6 C136.9,99.2 139.9,98.4 142.2,98.6 C133.8,88.0 127.5,74.4 143.8,58.0 C148.5,53.4 154.0,51.2 159.7,51.0 C160.3,49.4 163.2,43.6 171.4,40.1 C171.4,40.1 176.1,42.5 178.8,56.2 C183.1,58.6 187.2,61.8 190.9,65.4 C194.5,69.0 197.7,73.2 200.1,77.6 C213.8,80.2 216.3,84.9 216.3,84.9 C212.7,93.1 206.9,96.0 205.4,96.6 C205.1,102.4 203.0,107.8 198.3,112.5 C181.9,128.9 168.3,122.5 157.7,114.1 C157.9,116.9 156.7,120.9 152.7,124.9 L141.0,136.5 C139.8,137.7 141.6,141.9 141.8,141.8 Z" fill="currentColor" class="octo-body"/></svg></a><style>.github-corner:hover .octo-arm{animation:octocat-wave 560ms ease-in-out}@keyframes octocat-wave{0%,100%{transform:rotate(0)}20%,60%{transform:rotate(-25deg)}40%,80%{transform:rotate(10deg)}}@media (max-width:500px){.github-corner:hover .octo-arm{animation:none}.github-corner .octo-arm{animation:octocat-wave 560ms ease-in-out}}</style>
    <canvas id="spectrum" width="800" height="200"></canvas>
    <div class="main">
      <div>
        <h1 class="text" type="lyric" id="lyric"></h1>
      </div>
      <p type="text" id="pairlyric"></p>
      <audio id="audio" src="musicfile/Beyond - 海阔天空.flac" preload="metadata" lyricpath="https://music.emnasop.cn/musicfile/Beyond%20-%20%E6%B5%B7%E9%98%94%E5%A4%A9%E7%A9%BA.json"></audio>
      <div id="custom-audio-player" class="cap-player" role="region" aria-label="音频播放控制">
        <div class="cap-timeline-row">
          <span id="cap-current-time" class="cap-time cap-current-time">00:00</span>
          <div class="cap-progress-wrapper">
            <input id="cap-seek-bar" class="cap-range cap-seek-bar" type="range" min="0" max="100" value="0" step="0.1" aria-label="播放进度" />
          </div>
          <span id="cap-duration-time" class="cap-time cap-duration-time">00:00</span>
        </div>
        <div class="cap-controls-row">
          <div class="cap-group cap-modes-group">
            <button id="cap-lyric-mode-btn" class="cap-btn cap-mode-btn" type="button" aria-label="切换歌词模式" title="切换歌词模式 (按T键)">
              <svg class="cap-icon" viewBox="0 0 24 24" data-icon="mdi:subtitles-outline" aria-hidden="true">
                <path fill="currentColor" d="M19 4H5c-1.11 0-2 .9-2 2v12a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2m0 14H5V6h14zm-9-4H6v-2h4zm8 0h-6v-2h6zm-4-4H6V8h8zm6 0h-4V8h4z"/>
              </svg>
              <span id="cap-lyric-mode-text" class="cap-badge">K1</span>
            </button>
            <button id="cap-vis-mode-btn" class="cap-btn cap-mode-btn" type="button" aria-label="切换频谱可视化" title="切换频谱可视化 (按Y键)">
              <svg class="cap-icon" viewBox="0 0 24 24" data-icon="mdi:equalizer" aria-hidden="true">
                <path fill="currentColor" d="M10 20h4V4h-4zm-6 0h4v-8H4zM16 9v11h4V9z"/>
              </svg>
              <span id="cap-vis-mode-text" class="cap-badge">S1</span>
            </button>
          </div>
          <div class="cap-group cap-playback-group">
            <button id="cap-prev-btn" class="cap-btn cap-step-btn" type="button" aria-label="快退5秒" title="快退 5 秒 (左方向键)">
              <svg class="cap-icon" viewBox="0 0 24 24" data-icon="mdi:skip-previous" aria-hidden="true">
                <path fill="currentColor" d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
              </svg>
            </button>
            <button id="cap-play-btn" class="cap-btn cap-play-btn" type="button" aria-label="播放/暂停" title="播放 / 暂停 (空格键)">
              <svg id="cap-icon-play" class="cap-icon cap-icon-main" viewBox="0 0 24 24" data-icon="mdi:play" aria-hidden="true">
                <path fill="currentColor" d="M8 5v14l11-7z"/>
              </svg>
              <svg id="cap-icon-pause" class="cap-icon cap-icon-main" viewBox="0 0 24 24" data-icon="mdi:pause" aria-hidden="true" style="display: none;">
                <path fill="currentColor" d="M14 19h4V5h-4M6 19h4V5H6z"/>
              </svg>
            </button>
            <button id="cap-next-btn" class="cap-btn cap-step-btn" type="button" aria-label="快进5秒" title="快进 5 秒 (右方向键)">
              <svg class="cap-icon" viewBox="0 0 24 24" data-icon="mdi:skip-next" aria-hidden="true">
                <path fill="currentColor" d="M16 6h2v12h-2zm-8.5 6L15 6v12z"/>
              </svg>
            </button>
            <button id="cap-replay-btn" class="cap-btn cap-step-btn" type="button" aria-label="重新播放" title="重新从头播放">
              <svg class="cap-icon" viewBox="0 0 24 24" data-icon="mdi:replay" aria-hidden="true">
                <path fill="currentColor" d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6s-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8s-3.58-8-8-8z"/>
              </svg>
            </button>
          </div>
          <div class="cap-group cap-volume-group">
            <button id="cap-volume-btn" class="cap-btn cap-volume-btn" type="button" aria-label="音量/静音" title="静音 / 恢复音量 (上下方向键调节)">
              <svg id="cap-icon-vol-high" class="cap-icon" viewBox="0 0 24 24" data-icon="mdi:volume-high" aria-hidden="true">
                <path fill="currentColor" d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77M16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02M3 9v6h4l5 5V4L7 9z"/>
              </svg>
              <svg id="cap-icon-vol-med" class="cap-icon" viewBox="0 0 24 24" data-icon="mdi:volume-medium" aria-hidden="true" style="display: none;">
                <path fill="currentColor" d="M5 9v6h4l5 5V4L9 9zm11.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02"/>
              </svg>
              <svg id="cap-icon-vol-mute" class="cap-icon" viewBox="0 0 24 24" data-icon="mdi:volume-mute" aria-hidden="true" style="display: none;">
                <path fill="currentColor" d="M12 4L9.91 6.09L12 8.18M4.27 3L3 4.27l4.73 4.73H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9zM19 12c0 .82-.15 1.61-.41 2.34l1.53 1.53c.56-1.17.88-2.48.88-3.87c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71m-2.5 0c0-.53-.12-1.03-.3-1.5l1.65-1.65c.42.94.65 1.99.65 3.15z"/>
              </svg>
            </button>
            <div class="cap-volume-wrapper">
              <input id="cap-volume-slider" class="cap-range cap-volume-slider" type="range" min="0" max="1" step="0.01" value="1" aria-label="音量调节" />
            </div>
          </div>
        </div>
      </div>
    </div>
<script src="player2.js"></script>
</body>
</html>
